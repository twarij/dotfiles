version: '3'

tasks:
  install-node:
    desc: Install Node LTS via fnm
    set: [e]
    cmds:
      - |
        echo "[*] installing node lts via fnm."
        fnm install --lts
        echo "[ok] node installed!"

  install-python:
    desc: Install Python (latest stable) via uv
    set: [e]
    cmds:
      - |
        echo "[*] installing python (latest stable) via uv."
        # pre-installs latest CPython so the first `uv run` is fast; use `uv run` / `uv venv` per project
        uv python install
        echo "[ok] python installed!"

  install-claude-code:
    desc: Install Claude Code CLI
    set: [e]
    cmds:
      - |
        if command -v claude >/dev/null 2>&1; then
          echo "[i] claude code already installed, skipping."
          exit 0
        fi
        echo "[*] installing claude code."
        # native installer: user-scope (no admin), auto-updates in the background
        if [ "$OS" = "Windows_NT" ]; then
          powershell -NoProfile -Command "irm https://claude.ai/install.ps1 | iex"
        else
          curl -fsSL https://claude.ai/install.sh | bash
        fi
        echo "[ok] claude code installed!"

  install-third-party-skills:
    desc: Install third-party Claude Code skills
    set: [e]
    cmds:
      - |
        # `fnm exec` puts node on PATH itself; `eval "$(fnm env --shell bash)"` emits a
        # `:`-joined Unix PATH that breaks under Task's shell on Windows (`;`-separated)
        # On Windows npx is npx.cmd, and fnm's process spawn only auto-appends .exe
        npx_bin=npx
        if [ "$OS" = "Windows_NT" ]; then npx_bin=npx.cmd; fi
        npx() { fnm exec --using=lts-latest -- "$npx_bin" "$@"; }

        # npx skills add installs relative to cwd, and this task's cwd is setup/shared/, not $HOME
        # Windows sets USERPROFILE, not necessarily HOME
        cd "${HOME:-$USERPROFILE}"

        # `skills add` always re-clones and overwrites, even if already installed, so check first
        installed_skills="$(npx --yes skills list -g 2>/dev/null)"

        skills_installed() {
          for skill in "$@"; do
            # shell builtin, not grep: Task's shell on Windows has no grep binary to call
            case "$installed_skills" in
              *"$skill"*) ;;
              *) return 1 ;;
            esac
          done
        }

        if skills_installed debug-mantra scrutinize post-mortem; then
          echo "[i] 9arm-skills already installed, skipping."
        else
          echo "[*] installing 9arm-skills."
          npx --yes skills add thananon/9arm-skills -s debug-mantra scrutinize post-mortem -a claude-code -g -y
          echo "[ok] 9arm-skills installed!"
        fi

        if skills_installed grilling; then
          echo "[i] mattpocock-skills already installed, skipping."
        else
          echo "[*] installing mattpocock-skills."
          npx --yes skills add mattpocock/skills -s grilling -a claude-code -g -y
          echo "[ok] mattpocock-skills installed!"
        fi

  setup:
    desc: Run all shared setup tasks in order
    cmds:
      - task: install-node
      - task: install-python
      - task: install-claude-code
      - task: install-third-party-skills
